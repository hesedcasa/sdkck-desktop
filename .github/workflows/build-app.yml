name: Build desktop app

permissions:
  contents: read

# Installers for every platform, attached to the run as artifacts. Runs for
# release tags and on demand; code signing/notarization is not configured yet,
# so macOS and Windows builds are unsigned.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Bundle for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, os: ubuntu-22.04, args: ''}
          - {name: macos-arm64, os: macos-latest, args: '--target aarch64-apple-darwin'}
          - {name: macos-x64, os: macos-latest, args: '--target x86_64-apple-darwin'}
          - {name: windows-x64, os: windows-latest, args: ''}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "${{ runner.os }}" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Build installers
        shell: bash
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdkck-desktop-${{ matrix.name }}
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
          if-no-files-found: error
