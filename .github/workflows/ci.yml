name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # tauri::generate_context! embeds the frontend, so it must exist to compile.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install sdkck for the warm-runner tests
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/sdkck-rt" --no-fund --no-audit sdkck@latest
          echo "SDKCK_TEST_ROOT=$RUNNER_TEMP/sdkck-rt/node_modules/sdkck" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - run: npm ci
      - run: npm test
      - run: npm run build
