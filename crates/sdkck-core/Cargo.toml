[package]
name = "sdkck-core"
description = "Native core of sdkck Desktop: command catalog, search, permissions, plugins and a warm command runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nucleo-matcher = "0.3"
which = "8"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
