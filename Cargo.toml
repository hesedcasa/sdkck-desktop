[workspace]
resolver = "2"
members = ["crates/sdkck-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hesedcasa/sdkck-desktop"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
